<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/image/Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قرعة الحج | Hajj Lottery</title>
    <!-- Plus Jakarta Sans (Latin) and Cairo (Arabic) — the app's one typography
         system, applied by writing direction in index.css. Preconnect first so
         the stylesheet round-trip doesn't wait behind DNS/TLS; `display=swap`
         and the fallback stacks in index.css keep the app readable the instant
         it can be, whether or not this request ever completes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
